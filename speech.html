<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speech Probe · 發音模型測試</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e2e0d8;--acc:#2f6fed;--ok:#1a8f4c;--bad:#c8402f;--warn:#b7791f;--chip:#eef2fb}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1f1f23;--ink:#eeeef0;--mut:#9a9aa2;--line:#33333a;--acc:#6f9dff;--ok:#4cc47f;--bad:#f07a68;--warn:#e0a94a;--chip:#262b3a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:24px;margin:20px 0 4px}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 4px;color:var(--mut)}
.sub,.note{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px}
button{cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mono{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:12px;font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
textarea{width:100%;height:160px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px}
.fb{font-size:16px;margin:6px 0}
</style>
</head>
<body>
<main>
<h1>發音模型測試</h1>
<p class="sub">在瀏覽器裡跑音素辨識模型（wav2vec2 XLSR-53），不用伺服器，聲音不會上傳。做法是把目標句子的音素強制對齊到你的聲音上：長音和促音看每一拍的長度（和示範音比），清濁音看哪一種的機率高。</p>

<div class="card">
  <h2>1. 載入模型</h2>
  <div class="row">
    <select id="backend">
      <option value="wasm">WASM（q4，約 230 MB，最穩）</option>
      <option value="webgpu">WebGPU（q4f16，約 188 MB，較快，需要顯示卡支援）</option>
    </select>
    <button class="primary" id="btnLoad">載入模型</button>
  </div>
  <progress id="bar" max="100" value="0" hidden style="width:100%;height:14px"></progress>
  <div id="loadMsg" class="note">還沒載入。第一次要下載模型，之後瀏覽器會快取。</div>
</div>

<div class="card">
  <h2>2. 自己唸一次</h2>
  <div class="row">
    <select id="target"></select>
  </div>
  <div class="row">
    <button id="btnPlay" disabled>▶ 聽示範</button>
    <button id="btnRec" disabled>● 錄音：跟著示範唸</button>
  </div>
  <div class="row">
    <button id="btnPlayBad" disabled>▶ 聽唸錯的版本</button>
    <button id="btnRecBad" disabled>● 錄音：跟著唸錯的版本唸</button>
  </div>
  <div id="badNote" class="note"></div>
  <div id="recMsg" class="note">不用會日語：每一段只有 3 到 6 拍。先按 ▶ 聽（可以多聽幾次），再按 ● 錄音，照聽到的聲音跟著唸，唸完再按一次停止。有兩種版本的各錄一次。</div>
  <div id="recOut"></div>
</div>

<div class="card">
  <h2>3. 自我測試（合成語音，不用麥克風）</h2>
  <div class="note">用合成語音當成學習者來測。測試期間請讓這個分頁留在前景。</div>
  <div class="row"><button id="btnChunkTest" disabled>小段自我測試（約 2 分鐘）</button><button id="btnTest" disabled>舊的整句自我測試（約 3 分鐘）</button><span id="testMsg" class="note"></span></div>
  <div id="summary"></div>
</div>

<div class="card">
  <h2>結果（複製後貼給 Claude）</h2>
  <div class="row"><button id="btnCopy">複製</button><span id="copyMsg" class="note"></span></div>
  <textarea id="out" readonly></textarea>
</div>
</main>

<script src="speech_clips.js"></script>
<script src="speech_chunks.js"></script>
<script src="speech_core.js"></script>
<script>
"use strict";
const TF_URL="https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/dist/transformers.min.js";
const MODEL_ID="qnighy/wav2vec2-xlsr-53-espeak-cv-ft-ONNX";
const $=id=>document.getElementById(id);
const CLIPS=window.CLIPS||[];
const REPORT={page:"speech.html v5",model:MODEL_ID,ua:navigator.userAgent,backend:null,dtype:null,loadSec:null,recordings:[],chunktest:null,selftest:null};
function showReport(){$("out").value=JSON.stringify(REPORT,null,1);}
const tick=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>r();c.port2.postMessage(0);});

/* ========== 模型 ========== */
let model=null,extractor=null;
async function loadModel(){
  const sel=$("backend").value,device=sel==="webgpu"?"webgpu":"wasm",dtype=sel==="webgpu"?"q4f16":"q4";
  $("btnLoad").disabled=true;$("btnLoad").textContent="載入中…";$("loadMsg").className="note";const t0=performance.now(),bar=$("bar");
  // 進度顯示：stage 是目前階段的文字，pct 是下載百分比（沒有就顯示跑動條），每 0.5 秒更新已經過的秒數
  let stage="",pct=null;
  const paint=()=>{
    const el=Math.round((performance.now()-t0)/1000);
    if(pct==null) bar.removeAttribute("value");else bar.value=pct;
    $("loadMsg").textContent=`${stage}（已 ${el} 秒）`;
  };
  const say=(s,p)=>{stage=s;pct=p===undefined?null:p;paint();};
  bar.hidden=false;const timer=setInterval(paint,500);
  try{
    if(device==="webgpu"&&!navigator.gpu) throw new Error("這個瀏覽器沒有 WebGPU，請改選 WASM");
    say("步驟 1/3：載入程式庫");
    const T=await import(TF_URL);
    T.env.allowLocalModels=false;
    if(location.protocol==="file:") T.env.useBrowserCache=false;     // 直接開檔案時瀏覽器不能快取模型，每次都會重新下載
    say("步驟 2/3：下載模型（如果之前下載過會直接跳過）");
    model=await T.AutoModelForCTC.from_pretrained(MODEL_ID,{dtype,device,progress_callback:p=>{
      if(p.status==="progress"&&p.file&&/\.onnx/.test(p.file)){
        const mb=x=>Math.round((x||0)/1048576),has=p.total>0,q=has?Math.min(100,p.loaded/p.total*100):null;
        if(q!=null&&q>=100) say("步驟 3/3：把模型放進記憶體（這一步沒有百分比，通常 5 到 30 秒）");
        else say(has?`步驟 2/3：下載模型 ${Math.round(q)}%（${mb(p.loaded)} / ${mb(p.total)} MB）`:`步驟 2/3：下載模型，已下載 ${mb(p.loaded)} MB`,q==null?undefined:q);
      }else if(p.status==="done"&&p.file&&/\.onnx/.test(p.file)) say("步驟 3/3：把模型放進記憶體（這一步沒有百分比，通常 5 到 30 秒）");
    }});
    say("步驟 3/3：載入前處理設定與詞表");
    extractor=await T.Wav2Vec2FeatureExtractor.from_pretrained(MODEL_ID);
    const vj=await (await fetch(`https://huggingface.co/${MODEL_ID}/resolve/main/vocab.json`)).json();
    const vocab=[];for(const [tok,i] of Object.entries(vj)) vocab[i]=tok;
    SP.init(vocab);
    clearInterval(timer);bar.hidden=true;
    REPORT.backend=device;REPORT.dtype=dtype;REPORT.loadSec=+((performance.now()-t0)/1000).toFixed(1);
    $("loadMsg").innerHTML=`<span class="ok" style="font-size:17px;font-weight:600">✓ 模型已載入，可以到下面錄音了</span>　（${device} / ${dtype}，${REPORT.loadSec} 秒）`;
    $("btnLoad").textContent="已載入 ✓";
    modelReady=true;$("btnTest").disabled=false;$("btnChunkTest").disabled=false;$("btnRec").disabled=false;showBadNote();showReport();
    return true;
  }catch(e){
    clearInterval(timer);bar.hidden=true;
    console.error(e);$("loadMsg").textContent="載入失敗："+(e&&e.message||e)+"　請再按一次「載入模型」。";REPORT.loadError=String(e&&e.message||e);showReport();
    $("loadMsg").className="bad";$("btnLoad").disabled=false;$("btnLoad").textContent="載入模型";model=null;return false;
  }
}
/* pcm: Float32Array，單聲道 16 kHz → 每格（20 毫秒）對詞表的 log 機率 */
async function lsOfPcm(pcm){
  const {logits}=await model(await extractor(pcm));
  return SP.logSoftmax(logits.dims,logits.data);
}
function clipPcm(c){
  const bin=atob(c.b64),n=bin.length>>1,f=new Float32Array(n);
  for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;f[i]=v/32768;}
  return f;
}
const lsCache=new Map();
async function lsOfClip(c,speed){
  const key=c.id+"@"+(speed||1);
  if(!lsCache.has(key)) lsCache.set(key,await lsOfPcm(speed&&speed!==1?SP.resample(clipPcm(c),speed):clipPcm(c)));
  return lsCache.get(key);
}
function playPcm(f){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const b=ac.createBuffer(1,f.length,16000);b.getChannelData(0).set(f);
  const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.onended=()=>ac.close();s.start();
}

/* ========== 錄音 ========== */
/* 目標是 3 到 6 拍的小段。有「唸錯的版本」的小段只差一個音（少了促音、長音變短、清濁互換）。 */
const CHUNKS=window.CHUNKS||[];
const TARGETS=CHUNKS.map(c=>({label:c.said+"（"+c.zh+"）"+(c.bad?"":"　※沒有唸錯的版本"),kana:c.kana,clip:c,bad:c.bad||null,note:c.bad?c.bad.note:null}));
$("target").innerHTML=TARGETS.map((t,i)=>`<option value="${i}">${t.label}</option>`).join("");
const curTarget=()=>TARGETS[+$("target").value];
let modelReady=false;
function showBadNote(){
  const t=curTarget();if(!t)return;
  $("badNote").textContent=t.bad?"唸錯的版本改了這裡："+t.note:"這一段沒有唸錯的版本，只錄「跟著示範唸」就好。";
  $("btnPlayBad").disabled=!t.bad;$("btnRecBad").disabled=!t.bad||!modelReady;
}
$("target").addEventListener("change",showBadNote);
let rec=null,chunks=[],recStream=null,recMode="correct";
async function blobToPcm16k(blob){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const ab=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
  const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(ab.duration*16000)),16000);
  const src=off.createBufferSource();src.buffer=ab;src.connect(off.destination);src.start();
  return (await off.startRendering()).getChannelData(0);
}
function recSay(m,cls){const e=$("recMsg");e.textContent=m;e.className=cls||"note";e.style.fontSize=cls&&cls!=="note"?"16px":"";}
const REC_LABEL={correct:"● 錄音：跟著示範唸",wrong:"● 錄音：跟著唸錯的版本唸"};
async function toggleRec(mode){
  if(rec&&rec.state==="recording"){rec.stop();return;}
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){recSay("拿不到麥克風："+(e.message||e)+"　請確認電腦有接麥克風，並在網址列左邊允許這個網頁使用麥克風。","bad");return;}
  recMode=mode;const btn=mode==="wrong"?$("btnRecBad"):$("btnRec"),other=mode==="wrong"?$("btnRec"):$("btnRecBad");
  chunks=[];rec=new MediaRecorder(recStream);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
    recStream.getTracks().forEach(t=>t.stop());btn.textContent=REC_LABEL[mode];btn.classList.remove("primary");other.disabled=false;showBadNote();recSay("分析中，請等幾秒…","warn");
    try{await analyse(await blobToPcm16k(new Blob(chunks,{type:rec.mimeType})),curTarget(),mode);}
    catch(e){console.error(e);recSay("處理失敗："+(e.message||e),"bad");}
  };
  rec.start();btn.textContent="■ 錄音中，唸完按這裡停止";btn.classList.add("primary");other.disabled=true;recSay("● 錄音中…唸完按藍色的按鈕停止。","bad");
}
async function analyse(pcm,t,mode){
  const t1=performance.now(),L=await lsOfPcm(pcm),R=await lsOfClip(t.clip,1),res=SP.analyse(L,t.kana,R),sec=(performance.now()-t1)/1000;
  recSay(`完成（語音 ${(pcm.length/16000).toFixed(1)} 秒，運算 ${sec.toFixed(1)} 秒）。結果在下面。`,"ok");
  const pct=x=>Math.round(x*100)+"%";
  const expect=mode==="wrong"?`這次是跟著「唸錯的版本」唸（${t.note}），系統應該要在下面指出這個問題。`:"這次是跟著示範唸，理想情況下不該有紅字。";
  const feats=res.length.filter(g=>g.feat);
  $("recOut").innerHTML=`<div class="note" style="margin-top:10px">${expect}</div><h3>回饋</h3>${res.fb.length?res.fb.map(f=>`<div class="fb bad">${f.msg}</div>`).join(""):`<div class="fb ok">每個音都有唸出來，長度和清濁音也沒有發現問題</div>`}
  <h3>每個音有沒有唸出來（模型在那個位置認出這個音的機率）</h3><div class="scroll"><table><tr>${res.phones.map(x=>`<th class="mono">${x.q?"っ":""}${x.p}</th>`).join("")}</tr>
  <tr>${res.phones.map(x=>`<td class="n ${!x.opt&&(x.on<0||x.post<SP.WEAK_P)?"bad":""}">${x.on<0?"—":pct(x.post)}</td>`).join("")}</tr></table></div>
  <h3>長音／促音那一拍的長度（一格 20 毫秒）</h3><div class="scroll"><table><tr><th>拍</th><th>你</th><th>示範</th><th>實際長度</th><th>校正語速後</th></tr>
  ${feats.map(g=>`<tr><td class="mono">${g.seg}（${g.feat}）</td><td class="n">${g.dL}</td><td class="n">${g.dR}</td><td class="n">${pct(g.abs)}</td><td class="n">${g.norm?pct(g.ratio):"太短無法校正"}</td></tr>`).join("")||`<tr><td colspan="5">${res.length.length?"這一段沒有長音或促音":"對不上，無法比較"}</td></tr>`}</table></div>
  <h3>清濁音（正的表示像目標的音，負的表示像另一個）</h3><div class="scroll"><table><tr><th>目標</th><th>對照</th><th>差距</th></tr>
  ${res.voice.map(v=>`<tr><td class="mono">${v.p}</td><td class="mono">${v.alt}</td><td class="n ${v.margin<0?"bad":""}">${v.margin}</td></tr>`).join("")||`<tr><td colspan="3">這一段沒有清濁成對的音</td></tr>`}</table></div>
  <h3>參考</h3><div class="note mono">目標音素：${res.target}<br>模型自己輸出：${res.greedy}<br>對齊品質（每格平均 log 機率，越接近 0 越好）：${res.logpPerFrame}</div>`;
  REPORT.recordings.push({chunk:t.clip.id,kana:t.kana,imitated:mode||null,changed:mode==="wrong"?t.note:null,audioSec:+(pcm.length/16000).toFixed(1),sec:+sec.toFixed(1),...res});
  showReport();
}

/* ========== 小段自我測試 ==========
   用合成語音模擬「學習者」：正確版和唸錯版各用三種語速（原速、放慢 1.2 倍、加快到 0.85 倍），示範一律是原速的正確版。
   正確版不該有任何回饋；唸錯版應該出現對應類別的回饋。 */
async function chunkTest(){
  $("btnChunkTest").disabled=true;$("summary").innerHTML="";
  const t0=performance.now(),speeds=[1,1.2,0.85],rows=[];
  const want={sokuon:"short",long:"short",voice:"voice"};
  const sum={okN:0,okFlag:0,okMissing:0,badN:0,badHit:0,badMissing:0,byCat:{}};
  const jobs=[];for(const c of CHUNKS) for(const sp of speeds){if(sp!==1) jobs.push([c,c,sp,false]);if(c.bad) jobs.push([c,c.bad,sp,true]);}
  let i=0;
  for(const [c,clip,sp,isBad] of jobs){
    $("testMsg").textContent=`第 ${++i} / ${jobs.length} 段…`;await tick();
    const res=SP.analyse(await lsOfClip(clip,sp),c.kana,await lsOfClip(c,1));
    const cats=res.fb.map(f=>f.cat);
    rows.push({chunk:c.id,said:clip.said,speed:sp,wrong:isBad,complete:res.complete,fb:res.fb.map(f=>f.cat+":"+f.msg),feat:res.length.filter(g=>g.feat).map(g=>({seg:g.seg,abs:g.abs,ratio:g.ratio,norm:g.norm})),minVoice:res.voice.length?Math.min(...res.voice.map(v=>v.margin)):null,minPost:Math.min(...res.phones.filter(x=>!x.opt).map(x=>x.post))});
    if(isBad){
      const k=sum.byCat[c.cat]=sum.byCat[c.cat]||{n:0,hit:0};k.n++;sum.badN++;
      if(cats.includes(want[c.cat])){k.hit++;sum.badHit++;}
      if(cats.includes("missing")) sum.badMissing++;
    }else{sum.okN++;if(cats.some(x=>x!=="missing")) sum.okFlag++;if(cats.includes("missing")) sum.okMissing++;}
  }
  const total=(performance.now()-t0)/1000;
  REPORT.chunktest={totalSec:+total.toFixed(1),...sum,rows};
  const cat={sokuon:"促音",long:"長音",voice:"清濁音"};
  $("summary").innerHTML=`<div class="scroll"><table style="margin:8px 0"><tr><th>項目</th><th>結果</th></tr>
  ${Object.entries(sum.byCat).map(([k,v])=>`<tr><td>唸錯版（${cat[k]}）：有抓到</td><td>${v.hit} / ${v.n}</td></tr>`).join("")}
  <tr><td>正確版換語速：被誤報長度或清濁</td><td>${sum.okFlag} / ${sum.okN}</td></tr>
  <tr><td>正確版換語速：被說有音沒唸出來</td><td>${sum.okMissing} / ${sum.okN}</td></tr>
  <tr><td>唸錯版：被說有音沒唸出來</td><td>${sum.badMissing} / ${sum.badN}</td></tr></table></div>
  <div class="note">共 ${total.toFixed(0)} 秒。這些是合成語音的結果，真人的聲音要另外測。</div>`;
  $("testMsg").textContent="完成";$("btnChunkTest").disabled=false;showReport();
}

/* ========== 自我測試 ========== */
async function selfTest(){
  $("btnTest").disabled=true;$("summary").innerHTML="";
  const t0=performance.now();
  const rep=await SP.selfTest(CLIPS,lsOfClip,async(i,n)=>{$("testMsg").textContent=`第 ${i} / ${n} 段…`;await tick();});
  const total=(performance.now()-t0)/1000;
  rep.totalSec=+total.toFixed(1);REPORT.selftest=rep;
  const v=rep.voice,l=rep.length,s=rep.speed;
  $("summary").innerHTML=`<div class="scroll"><table style="margin:8px 0"><tr><th>項目</th><th>結果</th></tr>
  <tr><td>清濁音：兩個候選裡選對</td><td>${v.ok} / ${v.n}</td></tr>
  <tr><td>清濁音：唸對卻被標成有問題</td><td>${v.selfFlag} / ${v.selfN}</td></tr>
  <tr><td>長音／促音：唸短，抓到「太短」</td><td>${l.shortHit} / ${l.n}</td></tr>
  <tr><td>長音／促音：唸長，抓到「太長」</td><td>${l.longHit} / ${l.n}</td></tr>
  <tr><td>　其中有校正語速的組數</td><td>${l.norm} / ${l.n}</td></tr>
  <tr><td>換語速後：唸短，抓到「太短」</td><td>${s.shortHit} / ${s.n}</td></tr>
  <tr><td>換語速後：唸對卻被標「太短」</td><td>${s.okShortFalse} / ${s.n}</td></tr>
  <tr><td>換語速後：唸長，抓到「太長」</td><td>${s.longHit} / ${s.n}</td></tr>
  <tr><td>換語速後：唸對卻被標「太長」</td><td>${s.okLongFalse} / ${s.n}</td></tr></table></div>
  <div class="note">共 ${total.toFixed(0)} 秒。這些是合成語音的結果，真人的聲音要另外測。</div>`;
  $("testMsg").textContent="完成";$("btnTest").disabled=false;showReport();
}

$("btnLoad").addEventListener("click",loadModel);
$("btnTest").addEventListener("click",selfTest);
$("btnChunkTest").addEventListener("click",chunkTest);
$("btnRec").addEventListener("click",()=>toggleRec("correct"));
$("btnRecBad").addEventListener("click",()=>toggleRec("wrong"));
$("btnPlay").addEventListener("click",()=>playPcm(clipPcm(curTarget().clip)));
$("btnPlayBad").addEventListener("click",()=>{const t=curTarget();if(t.bad) playPcm(clipPcm(t.bad));});
$("btnCopy").addEventListener("click",async()=>{const t=$("out");t.select();try{await navigator.clipboard.writeText(t.value);$("copyMsg").textContent="已複製";}catch(e){try{document.execCommand("copy");$("copyMsg").textContent="已複製";}catch(_){$("copyMsg").textContent="複製失敗，請手動全選複製";}}});
$("btnPlay").disabled=!TARGETS.length;showBadNote();showReport();
if(!CLIPS.length) $("testMsg").textContent="找不到 speech_clips.js（要和這個檔案放在同一個資料夾）";
// 開頁面就自動載入模型（不用再按按鈕）；網址加 #selftest 會接著跑自我測試
if(TARGETS.length&&window.SP){
  if(location.hash.includes("webgpu")) $("backend").value="webgpu";
  loadModel().then(ok=>{if(!ok)return;if(location.hash.startsWith("#selftest")) selfTest();else if(location.hash.startsWith("#chunktest")) chunkTest();});
}
</script>
</body>
</html>
